<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG Knowledge Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --accent: #5b8cff;
    --text: #e8ebf3;
    --muted: #8a90a3;
    --bubble-user: #5b8cff;
    --bubble-bot: #232a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid #232a3d;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .stats { font-size: 13px; color: var(--muted); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 70%; padding: 12px 16px; border-radius: 14px; line-height: 1.45; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
  .sources { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .sources span { background: #2b3348; padding: 2px 8px; border-radius: 8px; margin-right: 6px; }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid #232a3d;
    background: var(--panel);
  }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2b3348;
    background: #10151f;
    color: var(--text);
    font-size: 14px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .upload-row { display: flex; gap: 10px; padding: 0 24px 12px; align-items: center; }
  .upload-row input[type=file] { color: var(--muted); font-size: 13px; }
  .upload-row button { padding: 8px 14px; font-size: 13px; }
  .status { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>📚 RAG Knowledge Assistant</h1>
  <div class="stats" id="stats">Loading stats…</div>
</header>

<div class="upload-row">
  <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
  <button id="uploadBtn">Upload & Ingest</button>
  <span class="status" id="uploadStatus"></span>
</div>

<div id="chat"></div>

<form id="chatForm">
  <input type="text" id="queryInput" placeholder="Ask a question about your documents…" autocomplete="off" />
  <button type="submit" id="sendBtn">Ask</button>
</form>

<script>
const API_BASE = "";

const chat = document.getElementById("chat");
const form = document.getElementById("chatForm");
const input = document.getElementById("queryInput");
const sendBtn = document.getElementById("sendBtn");
const statsEl = document.getElementById("stats");
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");

function addMessage(text, role, sources) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerText = text;

  if (sources && sources.length) {
    const src = document.createElement("div");
    src.className = "sources";
    src.innerHTML = "Sources: " + sources.map(s => `<span>${s}</span>`).join("");
    div.appendChild(src);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function refreshStats() {
  try {
    const res = await fetch(`${API_BASE}/stats`);
    const data = await res.json();
    statsEl.innerText = `${data.vector_count} chunks indexed`;
  } catch {
    statsEl.innerText = "Backend not reachable";
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;

  addMessage(query, "user");
  input.value = "";
  sendBtn.disabled = true;
  addMessage("Thinking…", "bot");
  const thinkingBubble = chat.lastChild;

  try {
    const res = await fetch(`${API_BASE}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const data = await res.json();
    chat.removeChild(thinkingBubble);
    if (!res.ok) {
      addMessage(`Error: ${data.detail || "something went wrong"}`, "bot");
    } else {
      addMessage(data.answer, "bot", data.sources);
    }
  } catch (err) {
    chat.removeChild(thinkingBubble);
    addMessage("Error reaching the backend. Is the server running?", "bot");
  } finally {
    sendBtn.disabled = false;
  }
});

uploadBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) {
    uploadStatus.innerText = "Choose a file first";
    return;
  }
  uploadStatus.innerText = "Uploading…";
  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) {
      uploadStatus.innerText = `Error: ${data.detail}`;
    } else {
      uploadStatus.innerText = `Added ${data.chunks_added} chunks from ${data.filename}`;
      refreshStats();
    }
  } catch {
    uploadStatus.innerText = "Upload failed";
  }
});

refreshStats();
</script>
</body>
</html>
